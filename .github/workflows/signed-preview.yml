name: Signed preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build and verify signed pair
        env:
          MURMUR_KEYSTORE_B64: ${{ secrets.MURMUR_KEYSTORE_B64 }}
          MURMUR_STORE_PASSWORD: ${{ secrets.MURMUR_STORE_PASSWORD }}
          MURMUR_KEY_ALIAS: ${{ secrets.MURMUR_KEY_ALIAS }}
          MURMUR_KEY_PASSWORD: ${{ secrets.MURMUR_KEY_PASSWORD }}
        run: |
          test -n "$MURMUR_KEYSTORE_B64"
          export MURMUR_KEYSTORE="$RUNNER_TEMP/murmur-signing.jks"
          trap 'rm -f "$MURMUR_KEYSTORE"' EXIT
          printf '%s' "$MURMUR_KEYSTORE_B64" | base64 --decode > "$MURMUR_KEYSTORE"
          export PATH="$ANDROID_HOME/build-tools/36.0.0:$PATH"
          ./scripts/package-release.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: murmur-companion-signed-pair
          path: artifacts/
