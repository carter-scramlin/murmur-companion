name: Build and publish signed beta
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: signed-beta-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build with the existing private beta key
        env:
          KEYSTORE_B64: ${{ secrets.MURMUR_KEYSTORE_B64 }}
          MURMUR_STORE_PASSWORD: ${{ secrets.MURMUR_STORE_PASSWORD }}
          MURMUR_KEY_PASSWORD: ${{ secrets.MURMUR_KEY_PASSWORD }}
          MURMUR_KEY_ALIAS: ${{ secrets.MURMUR_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_B64" || { echo 'Restore the pinned beta key through Actions secrets. A new signing key will not be generated.'; exit 1; }
          export MURMUR_KEYSTORE="$RUNNER_TEMP/beta.jks"
          trap 'rm -f "$MURMUR_KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$MURMUR_KEYSTORE"
          ./gradlew :core:test :phone:testDebugUnitTest :wear:testDebugUnitTest :phone:lintDebug :wear:lintDebug :phone:assembleDebug :wear:assembleDebug :phone:assembleRelease :wear:assembleRelease --console=plain
          python3 scripts/prepare-beta.py
      - name: Publish both install and debug pairs
        run: |
          version=$(python3 -c 'import re; print(re.search(r"versionName = \"([^\"]+)\"",open("phone/build.gradle.kts").read())[1])')
          gh release create "v$version" "artifacts/beta-$version/"* --target "$GITHUB_SHA" --draft --prerelease --title "Murmur Companion $version" --notes-file "docs/releases/$version.md"
          gh release edit "v$version" --draft=false
