name: Publish verified beta downloads
on:
  push:
    branches: ['codex/publish-*']
    paths: ['staged-release/**']
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-beta-downloads
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'build-tools;36.0.0'
      - name: Verify source, APK identity, signatures and checksums
        run: python3 scripts/verify-publication.py
      - name: Require passing source CI
        run: |
          for attempt in $(seq 1 50); do
            state=$(gh run list --workflow ci.yml --commit "$SOURCE_SHA" --json status,conclusion --jq '.[0] | if .status == "completed" then .conclusion else "waiting" end')
            if [ "$state" = success ]; then exit 0; fi
            if [ "$state" != waiting ] && [ -n "$state" ]; then echo "Source CI: $state"; exit 1; fi
            sleep 10
          done
          echo 'Source CI did not complete successfully in time.'
          exit 1
      - name: Publish complete matching downloads
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'This release already exists; refusing to replace published assets.'
            exit 1
          fi
          gh release create "$RELEASE_TAG" staged-release/* --target "$SOURCE_SHA" --draft --prerelease --title "Murmur Companion $RELEASE_VERSION · install fix & native beta" --notes-file "docs/releases/$RELEASE_VERSION.md"
          gh release edit "$RELEASE_TAG" --draft=false
          gh release view "$RELEASE_TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
