name: Android & Wear OS
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
        with:
          validate-wrappers: true
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test, lint and build both apps with one debug key
        run: ./gradlew :core:test :phone:testDebugUnitTest :wear:testDebugUnitTest :phone:lintDebug :wear:lintDebug :phone:assembleDebug :wear:assembleDebug --console=plain
      - name: Verify optimized builds with a disposable test key
        run: ./scripts/verify-optimized.sh
      - name: Package the matching pair
        run: |
          mkdir -p artifacts
          cp phone/build/outputs/apk/debug/phone-debug.apk artifacts/murmur-companion-phone-debug.apk
          cp wear/build/outputs/apk/debug/wear-debug.apk artifacts/murmur-companion-wear-debug.apk
          cd artifacts
          sha256sum *.apk > SHA256SUMS
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: murmur-companion-debug-pair
          path: artifacts/
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: verification-reports
          path: |
            core/build/reports/tests/
            phone/build/reports/tests/
            wear/build/reports/tests/
            phone/build/reports/screenshots/
            wear/build/reports/screenshots/
            phone/build/reports/lint-results-debug.*
            wear/build/reports/lint-results-debug.*
